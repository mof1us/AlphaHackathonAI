name: hackathon-alpha

x-backend-environment: &backend-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-elephants}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  INTEGRATIONS_TEMPORAL_TARGET: temporal:7233
  INTEGRATIONS_TEMPORAL_NAMESPACE: ${INTEGRATIONS_TEMPORAL_NAMESPACE:-default}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-elephants}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.1
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PWD: ${DB_PASSWORD:-postgres}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DEFAULT_NAMESPACE: ${INTEGRATIONS_TEMPORAL_NAMESPACE:-default}
      TEMPORAL_ADDRESS: temporal:7233
      SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 && temporal operator namespace describe --address temporal:7233 --namespace \"$$DEFAULT_NAMESPACE\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "${TEMPORAL_UI_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend-api:
    build:
      context: ./backend
      target: server
    environment:
      <<: *backend-environment
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  authorization-server:
    build:
      context: ./backend
      target: authorization-server
    environment:
      <<: *backend-environment
      AUTHORIZATION_SERVER_PORT: "9000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AUTHORIZATION_SERVER_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  temporal-runner:
    build:
      context: ./backend
      target: temporal-runner
    environment:
      <<: *backend-environment
      TEMPORAL_WORKERS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_AUTHORIZATION_URL: ${NEXT_PUBLIC_AUTHORIZATION_URL:-http://localhost:9000}
    environment:
      BACKEND_INTERNAL_URL: http://backend-api:8080
      AUTHORIZATION_INTERNAL_URL: http://authorization-server:9000
    depends_on:
      backend-api:
        condition: service_healthy
      authorization-server:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
